spring:
  application:
    name: game

game:
  # 게임 중 연결이 끊긴 플레이어를 기다려주는 시간. 지나면 자동 패스/선 넘김/세금 자동 반환
  # (모바일은 앱 전환만 해도 연결이 끊기므로 넉넉하게)
  disconnect-grace: 1m

server:
  servlet:
    session:
      # 로그인 세션 = 플레이어 식별. WebSocket 통신은 HTTP 세션을 갱신하지 않으므로,
      # 게임 도중 새로고침해도 같은 플레이어로 재접속할 수 있도록 넉넉하게 설정
      timeout: 6h
      # 세션 ID가 URL(;jsessionid=...)에 붙지 않도록 쿠키로만 추적
      tracking-modes: cookie
      cookie:
        http-only: true
