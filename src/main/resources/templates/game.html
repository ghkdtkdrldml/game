<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover: 노치/홈 바 영역까지 사용하고 safe-area 여백은 CSS에서 처리 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <title>달무티 (Great Dalmuti)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- SockJS 1.6.1, stomp.js 2.3.3: 외부 CDN 장애에 영향받지 않도록 서버에서 직접 제공 (cdnjs 원본과 SRI 해시 일치 확인) -->
    <script th:src="@{/js/lib/sockjs.min.js}"></script>
    <script th:src="@{/js/lib/stomp.min.js}"></script>
</head>
<body>

<div id="toasts" class="toasts"></div>

<div class="page">
    <header class="app-header">
        <div>
            <a class="app-title" th:href="@{/}" style="text-decoration: none;">👑 달무티</a>
            <span id="conn" class="conn"><span class="conn-dot"></span><span id="connText">연결 중</span></span>
        </div>
        <div class="header-actions">
            <button type="button" class="invite-btn" onclick="shareInvite()">🔗 초대</button>
            <details id="userMenu" class="user-menu">
                <summary th:text="${playerName} + ' ▾'">플레이어 ▾</summary>
                <div class="menu-items">
                    <!-- 알림음 (설정은 이 기기에 저장) -->
                    <button type="button" id="menuSound" class="btn-ghost" onclick="toggleSound()">🔊 소리 켜짐</button>
                    <!-- 방장 전용 -->
                    <button type="button" id="menuSettings" class="btn-ghost hidden" onclick="openSettings()">⚙️ 방 설정</button>
                    <button type="button" id="menuAbort" class="btn-ghost hidden" onclick="abortRound()">⏹ 판 중단</button>
                    <form th:action="@{/login}" method="get">
                        <input type="hidden" name="redirect" th:value="'/room/' + ${roomCode}">
                        <button type="submit" class="btn-ghost">이름 변경</button>
                    </form>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn-ghost">로그아웃</button>
                    </form>
                </div>
            </details>
        </div>
    </header>

    <!-- 게임 도중 들어온 경우: 다음 판 대기(관전) 안내 -->
    <div id="waitBanner" class="wait-banner">
        👀 게임이 진행 중입니다. <b>관전하면서 기다리면 다음 판부터 참여</b>합니다.
    </div>

    <!-- 혁명 선언 안내 (어릿광대 2장을 받은 본인에게만 표시) -->
    <div id="revBanner" class="rev-banner">
        <h2>🃏 어릿광대 2장!</h2>
        <div id="revText" class="my-task"></div>
    </div>

    <!-- 세금 교환 단계 안내 (해당 단계에서만 표시) -->
    <div id="taxBanner" class="tax-banner">
        <h2>💰 세금 교환 단계</h2>
        <div id="taxMyTask" class="my-task"></div>
        <div id="taxWaiting" class="waiting"></div>
    </div>

    <!-- 플레이어 -->
    <section class="panel">
        <div class="panel-title"><span id="playersTitle">플레이어</span></div>
        <div id="players" class="players"></div>
        <div id="waitingList" class="waiting-list hidden"></div>
    </section>

    <!-- 바닥 카드 / 차례 (손패 바로 위에서 비교하기 쉽도록) -->
    <section class="panel status">
        <div id="trick" class="trick"></div>
        <div id="turnText" class="turn-text hidden"></div>
    </section>

    <!-- 내 손패 -->
    <section id="handPanel" class="panel">
        <div class="panel-title">
            <span id="handTitle">내 손패</span>
            <button id="btnClear" class="link-btn hidden" onclick="clearSelection()">선택 해제</button>
        </div>
        <div id="hand" class="hand"></div>
    </section>

    <!-- 기록 (기본 접힘) -->
    <details class="panel log-panel">
        <summary>기록</summary>
        <div id="logBox" class="log-box"></div>
    </details>
</div>

<!-- 이모티콘·채팅 버튼 (하단 버튼 위 오른쪽에 떠 있음) -->
<div class="fab-group">
    <button type="button" id="btnEmote" class="fab" onclick="toggleEmotePalette()" aria-label="이모티콘">😀</button>
    <button type="button" id="btnChat" class="fab" onclick="openChat()" aria-label="채팅">
        💬<span id="chatBadge" class="fab-badge hidden"></span>
    </button>
</div>

<!-- 이모티콘 판: 누르면 내 플레이어 칩에서 이모티콘이 튀어 오름 -->
<div id="emotePalette" class="emote-palette hidden"></div>

<!-- 채팅창 -->
<div id="chatSheet" class="sheet-backdrop hidden" onclick="if (event.target === this) closeChat()">
    <div class="sheet chat-sheet">
        <div class="chat-header">
            <h3>💬 채팅</h3>
            <button type="button" class="link-btn" onclick="closeChat()">닫기</button>
        </div>
        <div id="chatList" class="chat-list"></div>
        <form id="chatForm" class="chat-form" onsubmit="sendChat(event)">
            <input type="text" id="chatInput" th:maxlength="${chatMaxLength}" placeholder="메시지 입력" autocomplete="off" enterkeyhint="send">
            <button type="submit">보내기</button>
        </form>
    </div>
</div>

<!-- 이모티콘·말풍선이 떠오르는 층 (플레이어 칩 위치에 맞춰 띄움) -->
<div id="floatLayer" class="float-layer"></div>

<!-- 하단 고정 액션 바 -->
<div class="action-bar">
    <div class="action-bar-inner">
        <div id="actionHint" class="action-hint"></div>
        <div class="action-buttons">
            <button id="btnStart" class="hidden" onclick="startGame()">게임 시작</button>
            <button id="btnDraw" class="btn-revolution hidden" onclick="drawSeatCard()">🎴 카드 뽑기</button>
            <button id="btnPass" class="btn-pass hidden" onclick="passTurn()">패스</button>
            <button id="btnPlay" class="hidden" onclick="playSelectedCards()">내기</button>
            <button id="btnTax" class="btn-tax hidden" onclick="returnTax()">돌려주기</button>
            <button id="btnNoRevolution" class="btn-ghost hidden" onclick="decideRevolution(false)">하지 않음</button>
            <button id="btnRevolution" class="btn-revolution hidden" onclick="decideRevolution(true)">🔥 혁명 선언</button>
        </div>
    </div>
</div>

<!-- 방장: 플레이어 칩을 탭하면 나오는 메뉴 -->
<div id="playerSheet" class="sheet-backdrop hidden" onclick="if (event.target === this) closeSheets()">
    <div class="sheet">
        <h3 id="playerSheetTitle"></h3>
        <button type="button" id="btnTransferHost" class="btn-tax" onclick="transferHost()">👑 방장 넘기기</button>
        <button type="button" id="btnKick" onclick="kickPlayer()">🚫 강퇴</button>
        <div class="sheet-note">게임 중에 강퇴하면 이번 판은 자동 패스로 처리되고, 판이 끝나면 나갑니다.</div>
        <button type="button" class="btn-ghost" onclick="closeSheets()">닫기</button>
    </div>
</div>

<!-- 방장: 방 설정 -->
<div id="settingsSheet" class="sheet-backdrop hidden" onclick="if (event.target === this) closeSheets()">
    <div class="sheet">
        <h3>⚙️ 방 설정</h3>
        <label>연결 끊김 대기 시간
            <select id="setGrace">
                <option value="30">30초</option>
                <option value="60">1분</option>
                <option value="180">3분</option>
                <option value="300">5분</option>
            </select>
        </label>
        <label>차례 제한 시간
            <select id="setTurnLimit">
                <option value="15">15초</option>
                <option value="30">30초</option>
                <option value="60">1분</option>
                <option value="90">1분 30초</option>
                <option value="0">제한 없음</option>
            </select>
        </label>
        <label>최대 인원
            <select id="setMaxPlayers"></select>
        </label>
        <label>게임 중 입장 허용 (다음 판 대기)
            <input type="checkbox" id="setLateJoin">
        </label>
        <div class="sheet-note">차례 제한 시간이 지나면 자동으로 패스합니다(선이면 선을 넘김). 연결이 끊긴 사람은 대기 시간이 지나면 차례를 넘기고, 방장이 자리를 비우면 방장도 넘어갑니다.</div>
        <button type="button" onclick="saveSettings()">저장</button>
        <button type="button" class="btn-ghost" onclick="closeSheets()">취소</button>
    </div>
</div>

<!-- 서버에서 내려주는 설정 (방 코드, 로그인 정보, 카드/신분 표시 이름) -->
<script th:inline="javascript">
    const GAME_CONFIG = {
        roomCode: /*[[${roomCode}]]*/ 'room',
        playerId: /*[[${playerId}]]*/ 'player-id',
        playerName: /*[[${playerName}]]*/ '플레이어',
        cards: /*[[${cards}]]*/ {},
        rankNames: /*[[${rankNames}]]*/ {},
        emotes: /*[[${emotes}]]*/ []
    };
</script>
<script th:src="@{/js/game.js}"></script>
</body>
</html>
