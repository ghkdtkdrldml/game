<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <title>달무티 - 입장</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="page login-box">
    <h1>👑 달무티</h1>

    <form class="panel" th:action="@{/login}" method="post">
        <h3>입장하기</h3>
        <p>게임에서 사용할 이름을 정해주세요. (1~12자)</p>

        <div class="error" th:if="${error}" th:text="${error}">오류 메시지</div>
        <!-- 초대 링크로 들어온 경우 로그인 후 그 방으로 -->
        <input type="hidden" name="redirect" th:value="${redirect}">

        <input type="text" name="name" th:value="${name}" placeholder="이름" maxlength="12"
               autocomplete="nickname" enterkeyhint="go" required autofocus>
        <button type="submit">입장</button>
    </form>

    <!-- 카드 아이콘 출처 표기 (CC BY 3.0 요구사항) -->
    <p class="credit">
        카드 아이콘: <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a>
        (Lorc, Delapouite, Cathelineau) ·
        <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>
    </p>
</div>

</body>
</html>
